<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Simulador de Lorentz 3D</title>
<style>
:root{--bg:#F3F4F6;--pn:#fff;--bd:#E5E7EB;--tx:#1F2937;--mu:#6B7280;--pr:#2563EB;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{flex:none;background:var(--pn);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:clamp(.95rem,2.6vw,1.15rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{flex:none;font:600 clamp(.75rem,2.4vw,.95rem) var(--mono);color:var(--pr);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 9px}
main{flex:1;min-height:0;display:flex}
#sim{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff}
#dash{flex:none;display:flex;gap:6px;padding:8px;overflow-x:auto;border-bottom:1px solid var(--bd);scrollbar-width:none}
#dash::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:4px 9px;white-space:nowrap}
.card b{display:block;font-size:.62rem;color:var(--mu);font-weight:600}
.card span{font:.82rem var(--mono)}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#leg{position:absolute;left:8px;bottom:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.72rem;pointer-events:none}
#leg span{background:rgba(255,255,255,.85);border-radius:10px;padding:1px 6px}
#leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
#leg b{font-weight:500}
.lt{display:none}
#bar{flex:none;display:flex;justify-content:center;gap:6px;padding:8px;border-top:1px solid var(--bd);background:var(--pn)}
#bar button{flex:0 1 112px}
aside{flex:none;width:clamp(300px,32vw,400px);min-height:0;background:var(--pn);border-left:1px solid var(--bd);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sec{padding:14px 16px;border-bottom:1px solid var(--bd)}
h2{font-size:.85rem;color:var(--mu);margin-bottom:10px}
button{font:600 .8rem system-ui,sans-serif;padding:7px 13px;border-radius:18px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
button:hover{background:var(--bd)}
button.pri,button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fld{margin-bottom:12px}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;margin-bottom:5px}
.fh div{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:2px 6px;font-size:.72rem;color:var(--mu);white-space:nowrap}
.fh input{width:84px;border:0;background:transparent;text-align:right;font:600 .82rem var(--mono);color:var(--pr);outline:0}
input[type=range]{width:100%;accent-color:var(--pr)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.82rem;margin-bottom:9px}
.sw input{flex:none}
.note{font-size:.75rem;line-height:1.6;color:var(--mu);background:var(--bg);border-radius:8px;padding:9px;margin-top:8px;overflow-wrap:anywhere}
@media(min-width:601px){.lt{display:inline}}
@media(max-width:800px){
  main{flex-direction:column}
  #sim{flex:none;height:clamp(270px,46vh,520px);height:clamp(270px,46dvh,520px)}
  aside{flex:1;width:auto;border-left:0;border-top:1px solid var(--bd)}
  .fh input{font-size:16px}
}
@media(max-height:520px) and (orientation:landscape){
  main{flex-direction:row}
  #sim{flex:1;height:auto}
  aside{flex:none;width:clamp(260px,40vw,340px);border-left:1px solid var(--bd);border-top:0}
  header{padding:4px 12px}#dash,#bar{padding:5px}.card{padding:2px 7px}
}
@media(pointer:coarse){button{min-height:42px}input[type=range]{height:30px}.sw input{width:22px;height:22px}}
</style>
</head>
<body>
<header><h1>Simulador de Lorentz 3D</h1><div class="eq">F = q(v × B)</div></header>
<main>
<section id="sim">
  <div id="dash"></div>
  <div id="stage">
    <canvas id="scene" role="img" aria-label="Trajetória 3D da partícula carregada"></canvas>
    <div id="leg"><span><i style="background:#F59E0B"></i>v<b class="lt"> velocidade</b></span><span><i style="background:#8B5CF6"></i>F<b class="lt"> força (∝ |v⊥|)</b></span><span><i style="background:#10B981"></i>B<b class="lt"> campo</b></span></div>
  </div>
  <div id="bar"><button id="play" class="pri">Pausar</button><button id="reset">Reset</button><button id="clr">Limpar</button></div>
</section>
<aside>
  <div class="sec"><h2>Cenários</h2><div class="row" id="pre"></div></div>
  <div class="sec"><h2>Partícula</h2><div class="row" id="kinds"></div><div class="note" id="cap"></div></div>
  <div class="sec"><h2>Campo magnético B (T)</h2><div id="gB"></div></div>
  <div class="sec"><h2>Velocidade inicial v (m/s)</h2><div id="gV"></div></div>
  <div class="sec"><h2>Câmera e exibição</h2>
    <div class="row"><button id="vTop">Topo (xy)</button><button id="vSide">Lateral (xz)</button><button id="v3d">3D</button></div>
    <div class="sw"><label for="cFollow">Câmera acompanha o centro de guia</label><input type="checkbox" id="cFollow" checked></div>
    <div class="sw"><label for="cVec">Mostrar vetores v e F</label><input type="checkbox" id="cVec" checked></div>
    <div class="sw"><label for="cTrail">Desenhar trajetória</label><input type="checkbox" id="cTrail" checked></div>
    <div class="sw"><label for="cField">Desenhar linhas de campo B</label><input type="checkbox" id="cField" checked></div>
    <div class="sw"><label for="cCmp">Modo comparativo (mesmo tempo e escala para todas as partículas)</label><input type="checkbox" id="cCmp"></div>
    <div class="note">Arraste para girar · scroll ou pinça para zoom · dois cliques reiniciam a câmera.</div>
    <div class="note" id="info"></div>
  </div>
</aside>
</main>
<script>
'use strict';
const E=1.602176634e-19,ME=9.1093837015e-31,MP=1.67262192369e-27,MA=6.6446573357e-27,C=299792458;
const PART={e:{q:-1,m:ME,n:'Elétron'},x:{q:1,m:ME,n:'Pósitron'},p:{q:1,m:MP,n:'Próton'},a:{q:2,m:MA,n:'Partícula α'}};
const REF_T=2*Math.PI*ME/E, REF_L=ME*1e7/E;   // elétron, 1 T, 1e7 m/s (referência do modo comparativo)
const $=id=>document.getElementById(id);
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],sc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],nrm=a=>Math.hypot(a[0],a[1],a[2]);
const cr=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const PFX=[[-15,'f'],[-12,'p'],[-9,'n'],[-6,'µ'],[-3,'m'],[0,''],[3,'k'],[6,'M'],[9,'G']];
function fmt(v,u){
  if(v==null||!isFinite(v))return '—'; if(v===0)return '0 '+u;
  const a=Math.abs(v); if(a<1e-15||a>=1e12)return v.toExponential(2)+' '+u;
  let ch=PFX[5]; for(const p of PFX) if(a>=Math.pow(10,p[0])*.999) ch=p;
  const s=v/Math.pow(10,ch[0]); return s.toFixed(Math.abs(s)>=100?1:Math.abs(s)>=10?2:3)+' '+ch[1]+u;
}

/* ---------- Física ---------- */
// Boris (rotação pura): conserva |v|. m aqui já é a massa relativística γm.
function boris(v,q,m,B,dt){
  const k=q*dt/(2*m),t=sc(B,k),t2=dot(t,t);
  const vp=add(v,cr(v,t));
  return add(v,cr(vp,sc(t,2/(1+t2))));
}
function derive(v,P){
  const sp=nrm(v),b=sp/C,g=1/Math.sqrt(1-b*b),Bm=nrm(P.B);
  if(Bm<1e-12) return {g,sp,Bm:0};
  const Bh=sc(P.B,1/Bm),vpar=dot(v,Bh),vperp=Math.sqrt(Math.max(0,sp*sp-vpar*vpar));
  const w=Math.abs(P.q)*Bm/(g*P.m),T=2*Math.PI/w;
  return {g,sp,Bm,Bh,vpar,vperp,T,w,r:g*P.m*vperp/(Math.abs(P.q)*Bm),pitch:vpar*T};
}

/* ---------- Controles ---------- */
const val={Bx:.5,By:0,Bz:1,vx:1e7,vy:0,vz:6e6};let kind='e';const ctl={};
const CFG=[['gB','Bx','Bx',-2,2,.1,'T'],['gB','By','By',-2,2,.1,'T'],['gB','Bz','Bz',-2,2,.1,'T'],
 ['gV','vx','vx',-1e8,1e8,1e6,'m/s'],['gV','vy','vy',-1e8,1e8,1e6,'m/s'],['gV','vz','vz',-1e8,1e8,1e6,'m/s']];
CFG.forEach(([g,id,lb,mn,mx,st,u])=>{
  const w=document.createElement('div');w.className='fld';
  w.innerHTML=`<div class="fh"><label>${lb}</label><div><input type="number" step="any" value="${val[id]}"> ${u}</div></div><input type="range" min="${mn}" max="${mx}" step="${st}" value="${val[id]}">`;
  $(g).appendChild(w);
  const num=w.querySelector('input[type=number]'),rng=w.querySelector('input[type=range]');
  const set=(v,silent)=>{v=Math.min(mx,Math.max(mn,v));val[id]=v;num.value=v;rng.value=v;if(!silent)reset();};
  rng.oninput=()=>set(parseFloat(rng.value));
  num.onchange=()=>set(parseFloat(num.value)||0);
  ctl[id]=set;
});
Object.keys(PART).forEach(k=>{
  const b=document.createElement('button');b.textContent=PART[k].n;b.dataset.k=k;
  b.onclick=()=>{setKind(k);reset();};$('kinds').appendChild(b);
});
function setKind(k){kind=k;document.querySelectorAll('#kinds button').forEach(b=>b.className=b.dataset.k===k?'on':'');}
const PRE=[['Elétron circular','e',0,0,1,1e7,0,0],['Próton circular','p',0,0,1,1e6,0,0],['Hélice 3D (elétron)','e',.5,0,1,1e7,0,6e6],
 ['Hélice 3D (próton)','p',0,.6,.8,2e6,0,1e6],['Partícula α','a',0,0,1,1e6,0,5e5],['v ∥ B (reta)','e',0,0,1,0,0,1e7],['Relativístico (0,33c)','e',0,0,1,1e8,0,0]];
PRE.forEach(p=>{
  const b=document.createElement('button');b.textContent=p[0];
  b.onclick=()=>{setKind(p[1]);['Bx','By','Bz','vx','vy','vz'].forEach((id,i)=>ctl[id](p[2+i],true));reset();};
  $('pre').appendChild(b);
});
setKind('e');

/* ---------- Estado ---------- */
const cv=$('scene'),cx=cv.getContext('2d');
let W=0,H=0,scale=1,zoom=1,yaw=-.7,pitch=.9,playing=true,lastT=null,fc=0;
let P,x,v,gm,d,rate,tSim,gc0,sp0,trail=[];
const FLD='#10B981',VEL='#F59E0B',FRC='#8B5CF6';

function params(){
  const k=PART[kind];let v0=[val.vx,val.vy,val.vz];const s=nrm(v0);
  if(s>.99*C)v0=sc(v0,.99*C/s);
  return {q:k.q*E,m:k.m,sign:Math.sign(k.q),name:k.n,B:[val.Bx,val.By,val.Bz],v0};
}
function guide(){ // centro de guia: x + γm(v×B)/(qB²)
  return d.Bm?add(x,sc(cr(v,P.B),gm/(P.q*d.Bm*d.Bm))):x.slice();
}
function fit(){
  if(!W||!d)return;
  let L;
  if($('cCmp').checked)L=REF_L;
  else if(d.Bm)L=Math.max(d.r,Math.abs(d.pitch)/10);
  else L=d.sp*3;
  if(!(L>0))L=1;
  scale=.3*Math.min(W,H)/L;
}
function reset(){
  P=params();x=[0,0,0];v=P.v0.slice();d=derive(v,P);gm=d.g*P.m;sp0=d.sp;tSim=0;
  rate=$('cCmp').checked?REF_T/2:(d.Bm&&d.T?d.T/2:1/3);
  gc0=guide();trail=[[0,0,0]];fit();readouts();info();
}
function readouts(){
  const cards=[['Raio r',d.Bm?fmt(d.r,'m'):'—'],['Período T',d.Bm?fmt(d.T,'s'):'—'],['|v|',fmt(d.sp,'m/s')+' ('+(d.sp/C*100).toFixed(1)+'% c)'],
   ['v∥ (ao longo de B)',d.Bm?fmt(d.vpar,'m/s'):'—'],['v⊥ (a B)',d.Bm?fmt(d.vperp,'m/s'):'—'],['Passo da hélice',d.Bm?fmt(d.pitch,'m'):'—'],['γ',d.g.toFixed(4)]];
  $('dash').innerHTML=cards.map(c=>`<div class="card"><b>${c[0]}</b><span>${c[1]}</span></div>`).join('');
  $('cap').innerHTML=`<b>${P.name}</b><br>q = ${fmt(P.q,'C')} · m = ${fmt(P.m,'kg')}<br>Modelo relativístico: massa efetiva γm = ${fmt(gm,'kg')}`;
}
function info(){
  const deg=a=>(a*180/Math.PI).toFixed(1)+'°';
  let s=`Tempo simulado: <b>${fmt(tSim,'s')}</b>`+(d.Bm?` (${(tSim/d.T).toFixed(2)} voltas)`:'')+`<br>Ritmo: 1 s real = <b>${fmt(rate,'s')}</b> simulados<br>Escala: 1 px = <b>${fmt(1/(scale*zoom),'m')}</b>`;
  if(d.Bm){
    const w=sub(x,gc0),wp=sub(w,sc(d.Bh,dot(w,d.Bh))),rm=nrm(wp);
    s+=`<br>Ângulo entre v e B: <b>${deg(Math.atan2(d.vperp,d.vpar))}</b><br>Verificação numérica: erro de |v| = <b>${(Math.abs(nrm(v)-sp0)/(sp0||1)).toExponential(1)}</b>`+(d.r>0?`; raio medido/teórico = <b>${(rm/d.r).toFixed(4)}</b>`:'');
  }else s+='<br>Sem campo: movimento retilíneo uniforme.';
  $('info').innerHTML=s;
}

/* ---------- Projeção 3D ortográfica (z para cima; yaw em z, pitch em x) ---------- */
let cam=[0,0,0];
function rot(p){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const xr=p[0]*cy+p[1]*sy,yr=-p[0]*sy+p[1]*cy;
  return [xr,p[2]*cp+yr*sp];
}
function proj(p){const r=rot(sub(p,cam)),S=scale*zoom;return [W/2+r[0]*S,H/2-r[1]*S];}
const Lw=()=>.3*Math.min(W,H)/(scale*zoom); // comprimento-base em metros para ~30% da tela
function arrow(a,b,col,w,hl){
  const dx=b[0]-a[0],dy=b[1]-a[1];
  cx.strokeStyle=cx.fillStyle=col;cx.lineWidth=w;cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke();
  if(Math.hypot(dx,dy)<hl*.8)return;
  const an=Math.atan2(dy,dx);cx.beginPath();cx.moveTo(b[0],b[1]);
  cx.lineTo(b[0]-hl*Math.cos(an-.4),b[1]-hl*Math.sin(an-.4));cx.lineTo(b[0]-hl*Math.cos(an+.4),b[1]-hl*Math.sin(an+.4));cx.closePath();cx.fill();
}
function drawField(g){
  if(!d.Bm)return;
  const Bh=d.Bh,l=Lw(),a=Math.abs(Bh[0])<.9?[1,0,0]:[0,1,0];
  let e1=cr(Bh,a);e1=sc(e1,1/nrm(e1));const e2=cr(Bh,e1),s0=dot(g,Bh),st=l*.9;
  cx.globalAlpha=.4;
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const base=add(g,add(sc(e1,i*1.6*l),sc(e2,j*1.6*l)));
    for(let k=Math.ceil((s0-4*l)/st);k<=Math.floor((s0+4*l)/st);k++){
      const p=add(base,sc(Bh,k*st-s0));arrow(proj(p),proj(add(p,sc(Bh,.5*l))),FLD,1.5,7);
    }
  }
  cx.globalAlpha=1;
}
function draw(){
  const g=guide();cam=$('cFollow').checked?g:[0,0,0];
  cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
  if($('cField').checked)drawField(g);
  const col=P.sign>0?'#EF4444':'#3B82F6';
  if($('cTrail').checked&&trail.length>1){
    cx.strokeStyle=col;cx.globalAlpha=.6;cx.lineWidth=2;cx.beginPath();
    trail.forEach((p,i)=>{const s=proj(p);i?cx.lineTo(s[0],s[1]):cx.moveTo(s[0],s[1]);});cx.stroke();cx.globalAlpha=1;
  }
  const pp=proj(x);
  if($('cVec').checked&&d.sp>0){
    const l=.9*Lw();
    arrow(pp,proj(add(x,sc(v,l/d.sp))),VEL,3,10);                         // v: direção real, projetada
    if(d.Bm&&d.vperp>1e-9*d.sp){                                          // F: comprimento ∝ |F| = |q|v⊥B
      const F=sc(cr(v,P.B),P.q),Fm=Math.abs(P.q)*d.sp*d.Bm;
      arrow(pp,proj(add(x,sc(F,l/Fm))),FRC,3,10);
    }
  }
  cx.beginPath();cx.fillStyle=col;cx.arc(pp[0],pp[1],8,0,7);cx.fill();
  cx.fillStyle='#fff';cx.font='bold 12px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(P.sign>0?'+':'−',pp[0],pp[1]);
  // gizmo dos eixos
  const o=[W-46,46];cx.font='11px sans-serif';
  [['x',[1,0,0],'#6B7280'],['y',[0,1,0],'#6B7280'],['z',[0,0,1],'#6B7280'],['B',d.Bm?d.Bh:null,FLD]].forEach(([n,u,c])=>{
    if(!u)return;const r=rot(u);arrow(o,[o[0]+r[0]*30,o[1]-r[1]*30],c,n==='B'?3:1.5,7);
    cx.fillStyle=c;cx.fillText(n,o[0]+r[0]*40,o[1]-r[1]*40);
  });
}

/* ---------- Loop ---------- */
function step(el){
  if(!playing)return;
  const run=Math.min(el,.05)*rate;
  const n=d.Bm&&d.T?Math.min(300,Math.max(1,Math.ceil(run/(d.T/200)))):1,dt=run/n;
  for(let i=0;i<n;i++){const va=v;v=boris(v,P.q,gm,P.B,dt);x=add(x,sc(add(va,v),dt/2));}
  tSim+=run;
  if($('cTrail').checked){trail.push(x.slice());if(trail.length>3000)trail.shift();}
}
function loop(t){
  if(lastT==null)lastT=t;step((t-lastT)/1000);lastT=t;
  draw();if(++fc%12===0)info();requestAnimationFrame(loop);
}
function resize(){
  const D=window.devicePixelRatio||1,p=cv.parentElement;W=p.clientWidth;H=p.clientHeight;
  cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);fit();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv.parentElement);

/* ---------- Interação ---------- */
const pts=new Map(),pdist=()=>{if(pts.size<2)return 0;const a=[...pts.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);};
const cz=z=>Math.max(.02,Math.min(z,60));let pd=0;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);pd=pdist();};
cv.onpointermove=e=>{
  if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===1){yaw+=(e.clientX-o[0])*.008;pitch=Math.max(-Math.PI/2,Math.min(Math.PI/2,pitch+(e.clientY-o[1])*.008));}
  else if(pts.size===2){const n=pdist();if(pd)zoom=cz(zoom*n/pd);pd=n;}
};
cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);pd=pdist();};
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=cz(zoom*(e.deltaY<0?1.15:1/1.15));},{passive:false});
const view=(y,p)=>{yaw=y;pitch=p;zoom=1;};
cv.ondblclick=()=>view(-.7,.9);
$('vTop').onclick=()=>view(0,Math.PI/2);$('vSide').onclick=()=>view(0,0);$('v3d').onclick=()=>view(-.7,.9);
$('play').onclick=e=>{playing=!playing;e.currentTarget.textContent=playing?'Pausar':'Retomar';e.currentTarget.className=playing?'pri':'';};
$('reset').onclick=reset;$('clr').onclick=()=>{trail=[x.slice()];};
$('cCmp').onchange=reset;

setKind('e');resize();reset();requestAnimationFrame(loop);
</script>
</body>
</html>
